services:
  - type: web
    name: isp-ai-observability-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: API_PORT
        value: "10000"
      - key: SIMULATOR_PORT
        value: "8001"
      - key: SIMULATOR_INTERVAL
        value: "5"
      - key: SIMULATOR_DEFAULT_SCENARIO
        value: normal
      - key: CORS_ORIGINS
        value: https://isp-ai-observability.pages.dev
