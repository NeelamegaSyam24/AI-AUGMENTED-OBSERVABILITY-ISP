global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'isp-observability'

# ── Alert rules ──────────────────────────────────────────────
rule_files:
  - "alerts/network_alerts.yml"

# ── Scrape targets ──────────────────────────────────────────
scrape_configs:

  # Network Simulator metrics
  - job_name: 'isp-simulator'
    static_configs:
      - targets: ['simulator:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # FastAPI / AI service metrics
  - job_name: 'isp-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
